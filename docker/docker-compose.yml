version: "3.8"

services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: postgis
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_TIMEZONE: Europe/Minsk
      POSTGRES_LOG_TIMEZONE: Europe/Minsk
    ports:
      - '5432'
    volumes:
      - '${POSTGRES_DATA}:/var/lib/postgresql/data'
    networks:
      - geonames
    restart: always

  geoserver:
    image: docker.osgeo.org/geoserver:2.24.x
    container_name: geoserver
    ports:
      - "8092:8080"
    environment:
      INSTALL_EXTENSIONS: "true"
      STABLE_EXTENSIONS: "ysld,h2,mongodb,vectortiles"
      COMMUNITY_EXTENSIONS: "ogcapi-features,ogcapi-images,ogcapi-maps,ogcapi-styles,ogcapi-tiles,sec-keycloak,sec-oauth2-openid-connect,spatialjson,mongodb-schemaless"
      CORS_ENABLED: true
      CORS_ALLOWED_ORIGINS: ${CLIENT_ORIGIN_HOST}
      CORS_ALLOWED_METHODS: GET,POST,PUT,DELETE,HEAD,OPTIONS
      CORS_ALLOWED_HEADERS: Origin,Accept,X-Requested-With,Content-Type,Access-Control-Request-Method,Access-Control-Request-Headers
    volumes:
      - '${GEOSERVER_DATA}:/opt/geoserver_data'
      - '${GEOSERVER_EXTENSIONS}:/opt/additional_libs'
    networks:
      - geonames
    depends_on:
      - mongodb
    restart: always

  api-gateway:
    image: enjoybymap/api-gateway:1.0.0
    container_name: api-gateway
    ports:
      - "8085:8080"
    environment:
      SPRING_PROFILES_ACTIVE: deploy
      GEOSERVER_HOST: ${GEOSERVER_HOST}
      MICROSERVICE_SPATIAL_HOST: ${MICROSERVICE_SPATIAL_HOST}
      CORS_ALLOWED_ORIGINS: ${GATEWAY_CORS_ALLOW_ORIGINS}
      CORS_ALLOWED_METHODS: ${GATEWAY_CORS_ALLOW_METHODS}
      CORS_ALLOWED_HEADERS: ${GATEWAY_CORS_ALLOW_HEADERS}
      CORS_ALLOWED_CREDENTIALS: ${GATEWAY_CORS_ALLOW_CREDENTIALS}
      LOGGING_LEVEL_ROOT: INFO
    volumes:
      - '${GATEWAY_DATA}/logs:/app/logs'
    networks:
      - geonames
    restart: always

  mongodb:
    image: mongo:4.4.21
    container_name: mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - '${MONGO_DATA}:/data/db'
    networks:
      - geonames
    restart: always

  mongo-express:
    image: mongo-express
    container_name: mongo_express
    ports:
      - "8093:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongodb
      - ME_CONFIG_MONGODB_PORT=27017
      - ME_CONFIG_MONGODB_ADMINUSERNAME=${ME_CONFIG_MONGODB_ADMINUSERNAME}
      - ME_CONFIG_MONGODB_ADMINPASSWORD=${ME_CONFIG_MONGODB_ADMINPASSWORD}
      - ME_CONFIG_SITE_BASEURL=${MONGO_EXPRESS_CONFIG_SITE_BASEURL}
    networks:
      - geonames
    depends_on:
      - mongodb

  microservice-spatial:
    image: enjoybymap/spatial-service:1.0.0
    container_name: microservice-spatial
    ports:
      - "8081"
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: ${SPATIAL_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPATIAL_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPATIAL_DATASOURCE_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${SPATIAL_CORS_ALLOW_ORIGINS}
      CORS_ALLOWED_METHODS: ${SPATIAL_CORS_ALLOW_METHODS}
      CORS_ALLOWED_HEADERS: ${SPATIAL_CORS_ALLOW_HEADERS}
      CORS_ALLOWED_CREDENTIALS: ${SPATIAL_CORS_ALLOW_CREDENTIALS}
      API_GATEWAY_URL: ${API_GATEWAY_URL}
      LOGGING_LEVEL_ROOT: INFO
      SPRING_MONGO_USERNAME: ${SPATIAL_MONGO_USERNAME}
      SPRING_MONGO_PASSWORD: ${SPATIAL_MONGO_PASSWORD}
      SPRING_MONGO_HOST: ${SPATIAL_MONGO_HOST}
      SPRING_MONGO_PORT: ${SPATIAL_MONGO_PORT}
      SPRING_MONGO_DB_NAME: ${SPATIAL_MONGO_DB_NAME}
      KAFKA_BOOTSTRAP_SERVERS: ${SPATIAL_KAFKA_BOOTSTRAP_SERVERS}
    networks:
      - geonames
    depends_on:
      - postgis
      - mongodb
    restart: always

  geonames-front:
    image: enjoybymap/geonames-front:1.0.0
    container_name: geonames-front
    ports:
      - "3000:3000"
    environment:
      REACT_APP_GEOSERVER_URL: ${REACT_APP_GEOSERVER_URL}
      REACT_APP_ENJOYBYMAP_API: ${REACT_APP_ENJOYBYMAP_API}
    networks:
      - geonames
    depends_on:
      - geoserver
      - api-gateway
    restart: always

  microservice-catalog:
    image: enjoybymap/catalog-service:1.0.0
    container_name: microservice-catalog
    ports:
      - "8082"
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: ${CATALOG_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${CATALOG_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${CATALOG_DATASOURCE_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${CATALOG_CORS_ALLOW_ORIGINS}
      CORS_ALLOWED_METHODS: ${CATALOG_CORS_ALLOW_METHODS}
      CORS_ALLOWED_HEADERS: ${CATALOG_CORS_ALLOW_HEADERS}
      CORS_ALLOWED_CREDENTIALS: ${CATALOG_CORS_ALLOW_CREDENTIALS}
      API_GATEWAY_URL: ${API_GATEWAY_URL}
      LOGGING_LEVEL_ROOT: INFO
    networks:
      - geonames
    depends_on:
      - postgis
    restart: always

  kafka-1:
    image: confluentinc/cp-kafka:7.8.0
    container_name: kafka1
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_BROKER_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka-1:9091,2@kafka-2:9091'
      KAFKA_LISTENERS: 'PLAINTEXT://:9090,CONTROLLER://:9091,EXTERNAL://:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka-1:9090,EXTERNAL://${HOSTNAME:-localhost}:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      CLUSTER_ID: 'EmptNWtoR4GGWx-BH6nGLQ'
    volumes:
      - ${KAFKA_ONE_DATA}:/var/lib/kafka/data
    networks:
      - geonames

  kafka-2:
    image: confluentinc/cp-kafka:7.8.0
    container_name: kafka2
    ports:
      - "9094:9094"
      - "9095:9095"
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_BROKER_ID: 2
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka-1:9091,2@kafka-2:9091'
      KAFKA_LISTENERS: 'PLAINTEXT://:9090,CONTROLLER://:9091,EXTERNAL://:9094'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka-2:9090,EXTERNAL://${HOSTNAME:-localhost}:9094'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      CLUSTER_ID: 'EmptNWtoR4GGWx-BH6nGLQ'
    volumes:
      - ${KAFKA_TWO_DATA}:/var/lib/kafka/data
    networks:
      - geonames

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-cluster-ui
    ports:
      - "9081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:9090,kafka-2:9090
    depends_on:
      - kafka-1
      - kafka-2
    networks:
      - kafka-net

networks:
  geonames:
    driver: bridge
  admin:
    driver: bridge
 
 
